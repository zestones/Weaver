<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 286" width="880" height="286" role="img" aria-labelledby="t d">
  <title id="t">What supervision costs, in seconds</title>
  <desc id="d">On a logarithmic scale from a tenth of a second to a hundred seconds: a hook on a tool call takes 0.13 s, a hook that records a flag 0.15 s, the end of a task 11 to 13 s, the writer 14 s for one card, a review by another agent 30 to 50 s.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; }
    .code { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; }
    .head { font-weight: 600; font-size: 13px; }
    .head.code { font-size: 12.5px; }
    .w rect, .w polygon { fill: #17806a; stroke: #0f5446; }
    .w text { fill: #ffffff; }
    .w .sub { fill: #d9f1ea; }
    .o rect, .o polygon { fill: #eef0f8; stroke: #8790b4; }
    .o text { fill: #161b2e; }
    .o .sub { fill: #454d6b; }
    .y rect, .y polygon { fill: #efeafd; stroke: #6247c2; }
    .y text { fill: #23194f; }
    .y .sub { fill: #4a3d86; }
    rect, polygon { stroke-width: 1.5; }
    .wire { fill: none; stroke: #6b7394; stroke-width: 1.5; }
    .wire.dotted { stroke-dasharray: 2 5; stroke-linecap: round; }
    .tip { fill: #6b7394; }
    .lbl { fill: #6b7394; font-size: 12px; }
    .frame { fill: none; stroke: #8790b4; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .frame-title { fill: #6b7394; font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; }
    .step { fill: #6b7394; font-size: 22px; font-weight: 700; }
    .axis { stroke: #8790b4; stroke-width: 1; }
    .grid { stroke: #8790b4; stroke-width: 1; stroke-dasharray: 2 5; opacity: 0.55; }
    .mark { fill: #17806a; stroke: #0f5446; stroke-width: 1.5; }
    .value { fill: #17806a; font-weight: 600; }
    .name { fill: #3d4563; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .o rect, .o polygon { fill: #1f2439; stroke: #6a73a0; }
      .o text { fill: #e7eaf6; }
      .o .sub { fill: #b4bcd6; }
      .y rect, .y polygon { fill: #271f47; stroke: #a78ff2; }
      .y text { fill: #efeafd; }
      .y .sub { fill: #c9bdf5; }
      .wire { stroke: #8d95b4; }
      .tip { fill: #8d95b4; }
      .lbl, .frame-title, .step { fill: #a3abc8; }
      .frame, .axis, .grid { stroke: #6a73a0; }
      .mark { fill: #45c2a6; stroke: #2a8f79; }
      .value { fill: #45c2a6; }
      .name { fill: #cfd5ea; }
    }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0.8 L 10 5 L 0 9.2 z" class="tip"/>
    </marker>
    <marker id="tip-back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 0.8 L 0 5 L 10 9.2 z" class="tip"/>
    </marker>
  </defs>

  <!-- The scale: each step is ten times the one before -->
  <line x1="340.0" y1="36" x2="340.0" y2="236" class="grid"/>
  <text x="340" y="256" class="lbl" text-anchor="middle">0.1 s</text>
  <line x1="506.7" y1="36" x2="506.7" y2="236" class="grid"/>
  <text x="506.7" y="256" class="lbl" text-anchor="middle">1 s</text>
  <line x1="673.3" y1="36" x2="673.3" y2="236" class="grid"/>
  <text x="673.3" y="256" class="lbl" text-anchor="middle">10 s</text>
  <line x1="840.0" y1="36" x2="840.0" y2="236" class="grid"/>
  <text x="840" y="256" class="lbl" text-anchor="middle">100 s</text>
  <line x1="340" y1="236" x2="840" y2="236" class="axis"/>
  <text x="590" y="276" class="lbl" text-anchor="middle">seconds, each step ten times the one before</text>

  <!-- One row a measure: a dot for one value, a bar for a range -->
  <text x="324" y="60" class="name" text-anchor="end">A hook, on a tool call</text>
  <circle cx="359.0" cy="56" r="6" class="mark"/>
  <text x="373" y="60" class="value" text-anchor="start">0.13 s</text>
  <text x="324" y="100" class="name" text-anchor="end">A hook that records a flag</text>
  <circle cx="369.3" cy="96" r="6" class="mark"/>
  <text x="383.3" y="100" class="value" text-anchor="start">0.15 s</text>
  <text x="324" y="140" class="name" text-anchor="end">The end of a task: repairs and checks</text>
  <rect x="680.2" y="130" width="12.1" height="12" rx="6" class="mark"/>
  <text x="706.3" y="140" class="value" text-anchor="start">11 to 13 s</text>
  <text x="324" y="180" class="name" text-anchor="end">The writer, for one card</text>
  <circle cx="697.7" cy="176" r="6" class="mark"/>
  <text x="711.7" y="180" class="value" text-anchor="start">14 s</text>
  <text x="324" y="220" class="name" text-anchor="end">A review by another agent</text>
  <rect x="752.9" y="210" width="37.0" height="12" rx="6" class="mark"/>
  <text x="738.9" y="220" class="value" text-anchor="end">30 to 50 s</text>
</svg>
