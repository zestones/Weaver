<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 644" width="880" height="644" role="img" aria-labelledby="t d">
  <title id="t">What happens when the agent says it has finished</title>
  <desc id="d">When the agent says it has finished, the programs of the project repair, then check. A broken gate rule refuses the end; a broken human rule is listed for you. When nothing is broken and a review is due, another agent judges the change: its findings refuse the end until the agent has answered each one. Then the unit is settled, and what the review leaves becomes cards.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; }
    .code { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; }
    .head { font-weight: 600; font-size: 13px; }
    .head.code { font-size: 12.5px; }
    rect, polygon { stroke-width: 1; }
    .w rect, .w polygon { fill: #edf3fa; stroke: #3d6fa5; }
    .w text { fill: #1f2328; }
    .w .sub { fill: #47515c; }
    .o rect, .o polygon { fill: #f6f8fa; stroke: #c4ccd4; }
    .o text { fill: #1f2328; }
    .o .sub { fill: #59636e; }
    .y rect, .y polygon { fill: #ffffff; stroke: #1f2328; stroke-width: 1.5; }
    .y text { fill: #1f2328; }
    .y .sub { fill: #59636e; }
    .wire { fill: none; stroke: #6e7781; stroke-width: 1.25; }
    .wire.dotted { stroke-dasharray: 2 4; stroke-linecap: round; }
    .tip { fill: #6e7781; }
    .lbl { fill: #6e7781; font-size: 12px; }
    .frame { fill: none; stroke: #afb8c1; stroke-width: 1; stroke-dasharray: 4 4; }
    .frame-title { fill: #6e7781; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
    .axis { stroke: #afb8c1; stroke-width: 1; }
    .grid { stroke: #afb8c1; stroke-width: 1; stroke-dasharray: 2 4; opacity: 0.7; }
    .mark { fill: #3d6fa5; stroke: #3d6fa5; stroke-width: 1; }
    .value { fill: #3d6fa5; font-weight: 600; }
    .name { fill: #6e7781; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .w rect, .w polygon { fill: #17212e; stroke: #5b8fc7; }
      .w text { fill: #f0f6fc; }
      .w .sub { fill: #b1bac4; }
      .o rect, .o polygon { fill: #151b23; stroke: #4d555e; }
      .o text { fill: #f0f6fc; }
      .o .sub { fill: #9198a1; }
      .y rect, .y polygon { fill: #0d1117; stroke: #f0f6fc; }
      .y text { fill: #f0f6fc; }
      .y .sub { fill: #9198a1; }
      .wire { stroke: #8b949e; }
      .tip { fill: #8b949e; }
      .lbl, .frame-title { fill: #9198a1; }
      .frame, .axis, .grid { stroke: #484f58; }
      .mark { fill: #5b8fc7; stroke: #5b8fc7; }
      .value { fill: #79a9dc; }
      .name { fill: #c9d1d9; }
    }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0.8 L 10 5 L 0 9.2 z" class="tip"/>
    </marker>
    <marker id="tip-back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 10 0.8 L 0 5 L 10 9.2 z" class="tip"/>
    </marker>
  </defs>

  <!-- The programs of the project judge -->
  <g class="o">
    <rect x="330" y="20" width="220" height="44" rx="6"/>
    <text x="440" y="46" class="head" text-anchor="middle">The agent says it has finished</text>
  </g>
  <path d="M 440 64 L 440 88" class="wire" marker-end="url(#tip)"/>
  <g class="w">
    <rect x="330" y="88" width="220" height="50" rx="6"/>
    <text x="440" y="109" class="head" text-anchor="middle">Repairs, then checks</text>
    <text x="440" y="125" class="sub" text-anchor="middle">by the programs of the project</text>
  </g>
  <path d="M 440 138 L 440 164" class="wire" marker-end="url(#tip)"/>
  <g class="w">
    <polygon points="440,164 560,206 440,248 320,206"/>
    <text x="440" y="202" class="head" text-anchor="middle">Which level of rule</text>
    <text x="440" y="218" class="sub" text-anchor="middle">is broken?</text>
  </g>
  <path d="M 320 206 L 260 206" class="wire" marker-end="url(#tip)"/>
  <text x="290" y="198" class="lbl" text-anchor="middle">gate</text>
  <g class="w">
    <rect x="40" y="174" width="220" height="64" rx="6"/>
    <text x="150" y="194" class="head" text-anchor="middle">The end is refused</text>
    <text x="150" y="210" class="sub" text-anchor="middle">the agent fixes it</text>
    <text x="150" y="226" class="sub" text-anchor="middle">and comes back</text>
  </g>
  <path d="M 560 206 L 620 206" class="wire" marker-end="url(#tip)"/>
  <text x="590" y="198" class="lbl" text-anchor="middle">human</text>
  <g class="y">
    <rect x="620" y="174" width="220" height="64" rx="6"/>
    <text x="730" y="194" class="head" text-anchor="middle">Listed for you</text>
    <text x="730" y="210" class="sub" text-anchor="middle">under To validate:</text>
    <text x="730" y="226" class="sub" text-anchor="middle">the agent is not held</text>
  </g>
  <path d="M 440 248 L 440 284" class="wire" marker-end="url(#tip)"/>
  <text x="448" y="270" class="lbl" text-anchor="start">none</text>

  <!-- Another agent judges -->
  <g class="w">
    <polygon points="440,284 560,326 440,368 320,326"/>
    <text x="440" y="330" class="head" text-anchor="middle">Is a review due?</text>
  </g>
  <path d="M 560 326 L 620 326" class="wire" marker-end="url(#tip)"/>
  <text x="590" y="318" class="lbl" text-anchor="middle">yes</text>
  <g class="w">
    <rect x="620" y="294" width="220" height="64" rx="6"/>
    <text x="730" y="314" class="head" text-anchor="middle">A review</text>
    <text x="730" y="330" class="sub" text-anchor="middle">another agent judges</text>
    <text x="730" y="346" class="sub" text-anchor="middle">the change</text>
  </g>
  <path d="M 730 358 L 730 414" class="wire" marker-end="url(#tip)"/>
  <text x="738" y="390" class="lbl" text-anchor="start">findings</text>
  <g class="w">
    <rect x="620" y="414" width="220" height="80" rx="6"/>
    <text x="730" y="434" class="head" text-anchor="middle">The end is refused</text>
    <text x="730" y="450" class="sub" text-anchor="middle">with the findings: the agent</text>
    <text x="730" y="466" class="sub" text-anchor="middle">answers each one, fixed</text>
    <text x="730" y="482" class="sub" text-anchor="middle">or not and why</text>
  </g>
  <path d="M 440 368 L 440 438" class="wire" marker-end="url(#tip)"/>
  <text x="448" y="404" class="lbl" text-anchor="start">no</text>
  <path d="M 620 344 L 600 344 Q 592 344 592 352 L 592 446 Q 592 454 584 454 L 550 454" class="wire" marker-end="url(#tip)"/>
  <text x="586" y="402" class="lbl" text-anchor="end">no finding</text>
  <path d="M 620 480 L 550 480" class="wire" marker-end="url(#tip)"/>
  <text x="585" y="498" class="lbl" text-anchor="middle">answered</text>

  <!-- The end -->
  <g class="w">
    <rect x="330" y="438" width="220" height="56" rx="6"/>
    <text x="440" y="462" class="head" text-anchor="middle">The unit is settled</text>
    <text x="440" y="478" class="sub" text-anchor="middle">its report is written</text>
  </g>
  <path d="M 440 494 L 440 538" class="wire dotted" marker-end="url(#tip)"/>
  <text x="448" y="521" class="lbl" text-anchor="start">what the review leaves</text>
  <g class="y">
    <rect x="310" y="538" width="260" height="64" rx="6"/>
    <text x="440" y="558" class="head" text-anchor="middle">Becomes cards, for you</text>
    <text x="440" y="574" class="sub" text-anchor="middle">a finding not fixed,</text>
    <text x="440" y="590" class="sub" text-anchor="middle">or a suspicion</text>
  </g>
  <g class="w"><rect x="40" y="618" width="12" height="12" rx="3"/></g>
  <text x="58" y="628" class="lbl" text-anchor="start">Weaver</text>
  <g class="o"><rect x="119.6" y="618" width="12" height="12" rx="3"/></g>
  <text x="137.6" y="628" class="lbl" text-anchor="start">the agent and the supervised project</text>
  <g class="y"><rect x="397.2" y="618" width="12" height="12" rx="3"/></g>
  <text x="415.2" y="628" class="lbl" text-anchor="start">you</text>
</svg>
