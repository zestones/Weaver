<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-labelledby="t d">
  <title id="t">How Weaver plugs in</title>
  <desc id="d">You give a request to an agent. The agent calls the engine of Weaver at each of its hooks. The engine reads what the supervised project declares, runs its commands, keeps its state under .git/weaver, hands the flags and what a review leaves to the memory, and starts a reviewer. The memory starts a writer. You run the weaver command from a terminal.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; }
    .code { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; }
    .head { font-weight: 600; font-size: 13px; }
    .head.code { font-size: 12.5px; }
    rect, polygon { stroke-width: 1; }
    .w rect, .w polygon { fill: #edf3fa; stroke: #3d6fa5; }
    .w text { fill: #1f2328; }
    .w .sub { fill: #47515c; }
    .o rect, .o polygon { fill: #f6f8fa; stroke: #c4ccd4; }
    .o text { fill: #1f2328; }
    .o .sub { fill: #59636e; }
    .y rect, .y polygon { fill: #ffffff; stroke: #1f2328; stroke-width: 1.5; }
    .y text { fill: #1f2328; }
    .y .sub { fill: #59636e; }
    .wire { fill: none; stroke: #6e7781; stroke-width: 1.25; }
    .wire.dotted { stroke-dasharray: 2 4; stroke-linecap: round; }
    .tip { fill: #6e7781; }
    .lbl { fill: #6e7781; font-size: 12px; }
    .frame { fill: none; stroke: #afb8c1; stroke-width: 1; stroke-dasharray: 4 4; }
    .frame-title { fill: #6e7781; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
    .axis { stroke: #afb8c1; stroke-width: 1; }
    .grid { stroke: #afb8c1; stroke-width: 1; stroke-dasharray: 2 4; opacity: 0.7; }
    .mark { fill: #3d6fa5; stroke: #3d6fa5; stroke-width: 1; }
    .value { fill: #3d6fa5; font-weight: 600; }
    .name { fill: #6e7781; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .w rect, .w polygon { fill: #17212e; stroke: #5b8fc7; }
      .w text { fill: #f0f6fc; }
      .w .sub { fill: #b1bac4; }
      .o rect, .o polygon { fill: #151b23; stroke: #4d555e; }
      .o text { fill: #f0f6fc; }
      .o .sub { fill: #9198a1; }
      .y rect, .y polygon { fill: #0d1117; stroke: #f0f6fc; }
      .y text { fill: #f0f6fc; }
      .y .sub { fill: #9198a1; }
      .wire { stroke: #8b949e; }
      .tip { fill: #8b949e; }
      .lbl, .frame-title { fill: #9198a1; }
      .frame, .axis, .grid { stroke: #484f58; }
      .mark { fill: #5b8fc7; stroke: #5b8fc7; }
      .value { fill: #79a9dc; }
      .name { fill: #c9d1d9; }
    }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0.8 L 10 5 L 0 9.2 z" class="tip"/>
    </marker>
    <marker id="tip-back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 10 0.8 L 0 5 L 10 9.2 z" class="tip"/>
    </marker>
  </defs>

  <!-- You, and the agent you work with -->
  <g class="y">
    <rect x="40" y="24" width="120" height="60" rx="6"/>
    <text x="100" y="50" class="head" text-anchor="middle">You</text>
    <text x="100" y="66" class="sub" text-anchor="middle">in a terminal</text>
  </g>
  <g class="o">
    <rect x="300" y="24" width="440" height="60" rx="6"/>
    <text x="520" y="50" class="head" text-anchor="middle">An agent: Claude Code or Codex</text>
    <text x="520" y="66" class="sub" text-anchor="middle">its hooks: request · before a call · after a call · end of turn</text>
  </g>
  <path d="M 160 42 L 300 42" class="wire" marker-end="url(#tip)"/>
  <text x="230" y="34" class="lbl" text-anchor="middle">a request</text>

  <!-- Weaver -->
  <rect x="20" y="138" width="840" height="152" rx="10" class="frame"/>
  <text x="846" y="158" class="frame-title" text-anchor="end">WEAVER</text>
  <g class="w">
    <rect x="40" y="176" width="180" height="64" rx="6"/>
    <text x="130" y="204" class="head code" text-anchor="middle">apps/cli</text>
    <text x="130" y="220" class="sub" text-anchor="middle">the weaver command</text>
  </g>
  <g class="w">
    <rect x="340" y="176" width="240" height="64" rx="6"/>
    <text x="460" y="204" class="head code" text-anchor="middle">packages/engine</text>
    <text x="460" y="220" class="sub" text-anchor="middle">the loop: it answers every hook</text>
  </g>
  <g class="w">
    <rect x="660" y="176" width="180" height="64" rx="6"/>
    <text x="750" y="204" class="head code" text-anchor="middle">packages/memory</text>
    <text x="750" y="220" class="sub" text-anchor="middle">flags, cards, registry</text>
  </g>
  <path d="M 80 84 L 80 176" class="wire" marker-end="url(#tip)"/>
  <text x="88" y="122" class="lbl" text-anchor="start">your commands</text>
  <path d="M 190 176 L 190 78 Q 190 70 198 70 L 300 70" class="wire" marker-end="url(#tip)"/>
  <text x="198" y="104" class="lbl" text-anchor="start">writes their hooks</text>
  <path d="M 435 84 L 435 176" class="wire" marker-end="url(#tip)"/>
  <text x="427" y="122" class="lbl" text-anchor="end">an event, as JSON</text>
  <path d="M 485 176 L 485 84" class="wire" marker-end="url(#tip)"/>
  <text x="493" y="122" class="lbl" text-anchor="start">nothing, a message or a refusal</text>
  <path d="M 580 208 L 660 208" class="wire" marker-end="url(#tip)"/>
  <text x="620" y="166" class="lbl" text-anchor="middle">flags, what a review leaves</text>

  <!-- The project it supervises -->
  <rect x="20" y="330" width="560" height="124" rx="10" class="frame"/>
  <text x="34" y="444" class="frame-title" text-anchor="start">THE SUPERVISED PROJECT</text>
  <g class="o">
    <rect x="40" y="366" width="170" height="60" rx="6"/>
    <text x="125" y="392" class="head code" text-anchor="middle">.weaver/</text>
    <text x="125" y="408" class="sub" text-anchor="middle">what it declares</text>
  </g>
  <g class="o">
    <rect x="225" y="366" width="170" height="60" rx="6"/>
    <text x="310" y="392" class="head" text-anchor="middle">Its commands</text>
    <text x="310" y="408" class="sub" text-anchor="middle">tsc, eslint, its scripts</text>
  </g>
  <g class="o">
    <rect x="410" y="366" width="150" height="60" rx="6"/>
    <text x="485" y="392" class="head code" text-anchor="middle">.git/weaver/</text>
    <text x="485" y="408" class="sub" text-anchor="middle">state, journal, cards</text>
  </g>
  <path d="M 370 240 L 370 290 Q 370 298 362 298 L 133 298 Q 125 298 125 306 L 125 366" class="wire" marker-end="url(#tip)"/>
  <text x="362" y="272" class="lbl" text-anchor="end">reads</text>
  <path d="M 410 240 L 410 308 Q 410 316 402 316 L 318 316 Q 310 316 310 324 L 310 366" class="wire" marker-end="url(#tip)"/>
  <text x="418" y="272" class="lbl" text-anchor="start">runs</text>
  <path d="M 485 240 L 485 366" class="wire" marker-end="url(#tip)"/>
  <text x="493" y="272" class="lbl" text-anchor="start">writes</text>

  <!-- The agents Weaver starts by itself -->
  <rect x="600" y="330" width="260" height="124" rx="10" class="frame"/>
  <text x="614" y="444" class="frame-title" text-anchor="start">AGENTS WEAVER STARTS</text>
  <g class="o">
    <rect x="614" y="366" width="114" height="60" rx="6"/>
    <text x="671" y="392" class="head" text-anchor="middle">A reviewer</text>
    <text x="671" y="408" class="sub" text-anchor="middle">judges a change</text>
  </g>
  <g class="o">
    <rect x="738" y="366" width="108" height="60" rx="6"/>
    <text x="792" y="392" class="head" text-anchor="middle">A writer</text>
    <text x="792" y="408" class="sub" text-anchor="middle">writes a card</text>
  </g>
  <path d="M 555 240 L 555 304 Q 555 312 563 312 L 663 312 Q 671 312 671 320 L 671 366" class="wire" marker-end="url(#tip)"/>
  <text x="613" y="306" class="lbl" text-anchor="middle">for a review</text>
  <path d="M 792 240 L 792 366" class="wire" marker-end="url(#tip)"/>
  <text x="784" y="312" class="lbl" text-anchor="end">for a card</text>
  <g class="w"><rect x="40" y="474" width="12" height="12" rx="3"/></g>
  <text x="58" y="484" class="lbl" text-anchor="start">Weaver</text>
  <g class="o"><rect x="119.6" y="474" width="12" height="12" rx="3"/></g>
  <text x="137.6" y="484" class="lbl" text-anchor="start">the agent and the supervised project</text>
  <g class="y"><rect x="397.2" y="474" width="12" height="12" rx="3"/></g>
  <text x="415.2" y="484" class="lbl" text-anchor="start">you</text>
</svg>
