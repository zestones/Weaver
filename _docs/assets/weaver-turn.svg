<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 282" width="880" height="282" role="img" aria-labelledby="t d">
  <title id="t">One turn, hook by hook</title>
  <desc id="d">Weaver is called four times in a turn: when you send a request, before each tool call, after each tool call, and when the agent stops. The two in the middle repeat for every call.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; }
    .code { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; }
    .head { font-weight: 600; font-size: 13px; }
    .head.code { font-size: 12.5px; }
    rect, polygon { stroke-width: 1; }
    .w rect, .w polygon { fill: #edf3fa; stroke: #3d6fa5; }
    .w text { fill: #1f2328; }
    .w .sub { fill: #47515c; }
    .o rect, .o polygon { fill: #f6f8fa; stroke: #c4ccd4; }
    .o text { fill: #1f2328; }
    .o .sub { fill: #59636e; }
    .y rect, .y polygon { fill: #ffffff; stroke: #1f2328; stroke-width: 1.5; }
    .y text { fill: #1f2328; }
    .y .sub { fill: #59636e; }
    .wire { fill: none; stroke: #6e7781; stroke-width: 1.25; }
    .wire.dotted { stroke-dasharray: 2 4; stroke-linecap: round; }
    .tip { fill: #6e7781; }
    .lbl { fill: #6e7781; font-size: 12px; }
    .frame { fill: none; stroke: #afb8c1; stroke-width: 1; stroke-dasharray: 4 4; }
    .frame-title { fill: #6e7781; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
    .axis { stroke: #afb8c1; stroke-width: 1; }
    .grid { stroke: #afb8c1; stroke-width: 1; stroke-dasharray: 2 4; opacity: 0.7; }
    .mark { fill: #3d6fa5; stroke: #3d6fa5; stroke-width: 1; }
    .value { fill: #3d6fa5; font-weight: 600; }
    .name { fill: #6e7781; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .w rect, .w polygon { fill: #17212e; stroke: #5b8fc7; }
      .w text { fill: #f0f6fc; }
      .w .sub { fill: #b1bac4; }
      .o rect, .o polygon { fill: #151b23; stroke: #4d555e; }
      .o text { fill: #f0f6fc; }
      .o .sub { fill: #9198a1; }
      .y rect, .y polygon { fill: #0d1117; stroke: #f0f6fc; }
      .y text { fill: #f0f6fc; }
      .y .sub { fill: #9198a1; }
      .wire { stroke: #8b949e; }
      .tip { fill: #8b949e; }
      .lbl, .frame-title { fill: #9198a1; }
      .frame, .axis, .grid { stroke: #484f58; }
      .mark { fill: #5b8fc7; stroke: #5b8fc7; }
      .value { fill: #79a9dc; }
      .name { fill: #c9d1d9; }
    }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0.8 L 10 5 L 0 9.2 z" class="tip"/>
    </marker>
    <marker id="tip-back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 10 0.8 L 0 5 L 10 9.2 z" class="tip"/>
    </marker>
  </defs>

  <!-- The hooks of the agent, in the order of a turn -->
  <g class="o">
    <rect x="4" y="58" width="188" height="54" rx="27"/>
    <text x="98" y="81" class="head" text-anchor="middle">1 · A request</text>
    <text x="98" y="97" class="sub code" text-anchor="middle">UserPromptSubmit</text>
  </g>
  <g class="o">
    <rect x="232" y="58" width="188" height="54" rx="27"/>
    <text x="326" y="81" class="head" text-anchor="middle">2 · Before a tool call</text>
    <text x="326" y="97" class="sub code" text-anchor="middle">PreToolUse</text>
  </g>
  <g class="o">
    <rect x="460" y="58" width="188" height="54" rx="27"/>
    <text x="554" y="81" class="head" text-anchor="middle">3 · After a tool call</text>
    <text x="554" y="97" class="sub code" text-anchor="middle">PostToolUse</text>
  </g>
  <g class="o">
    <rect x="688" y="58" width="188" height="54" rx="27"/>
    <text x="782" y="81" class="head" text-anchor="middle">4 · The end of the turn</text>
    <text x="782" y="97" class="sub code" text-anchor="middle">Stop</text>
  </g>
  <path d="M 192 85 L 232 85" class="wire" marker-end="url(#tip)"/>
  <path d="M 420 85 L 460 85" class="wire" marker-end="url(#tip)"/>
  <path d="M 648 85 L 688 85" class="wire" marker-end="url(#tip)"/>
  <path d="M 554 58 L 554 38 Q 554 30 546 30 L 334 30 Q 326 30 326 38 L 326 58" class="wire" marker-end="url(#tip)"/>
  <text x="440" y="22" class="lbl" text-anchor="middle">for every call</text>

  <!-- What Weaver does at each of them -->
  <path d="M 98 112 L 98 142" class="wire" marker-end="url(#tip)"/>
  <g class="w">
    <rect x="4" y="142" width="188" height="124" rx="6"/>
    <text x="18" y="168" class="sub" text-anchor="start">The request joins the</text>
    <text x="18" y="184" class="sub" text-anchor="start">unit of work.</text>
    <text x="18" y="216" class="sub" text-anchor="start">The agent is told how</text>
    <text x="18" y="232" class="sub" text-anchor="start">to flag what it finds.</text>
  </g>
  <path d="M 326 112 L 326 142" class="wire" marker-end="url(#tip)"/>
  <g class="w">
    <rect x="232" y="142" width="188" height="124" rx="6"/>
    <text x="246" y="168" class="sub" text-anchor="start">A flag is recorded: the</text>
    <text x="246" y="184" class="sub" text-anchor="start">hook answers for it.</text>
    <text x="246" y="216" class="sub" text-anchor="start">A call the project</text>
    <text x="246" y="232" class="sub" text-anchor="start">forbids is refused,</text>
    <text x="246" y="248" class="sub" text-anchor="start">with its rule.</text>
  </g>
  <path d="M 554 112 L 554 142" class="wire" marker-end="url(#tip)"/>
  <g class="w">
    <rect x="460" y="142" width="188" height="124" rx="6"/>
    <text x="474" y="168" class="sub" text-anchor="start">The files that changed</text>
    <text x="474" y="184" class="sub" text-anchor="start">join the unit of work:</text>
    <text x="474" y="200" class="sub" text-anchor="start">Weaver knows who</text>
    <text x="474" y="216" class="sub" text-anchor="start">changed what.</text>
  </g>
  <path d="M 782 112 L 782 142" class="wire" marker-end="url(#tip)"/>
  <g class="w">
    <rect x="688" y="142" width="188" height="124" rx="6"/>
    <text x="702" y="168" class="sub" text-anchor="start">The writer starts on</text>
    <text x="702" y="184" class="sub" text-anchor="start">the flags of the turn.</text>
    <text x="702" y="216" class="sub" text-anchor="start">Repairs, checks, review:</text>
    <text x="702" y="232" class="sub" text-anchor="start">the unit is settled, or</text>
    <text x="702" y="248" class="sub" text-anchor="start">the agent goes back.</text>
  </g>
</svg>
