<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d">
  <title id="t">From a flag to a decision</title>
  <desc id="d">An agent flags what it comes across. The hook records the flag and answers in place of the command. Once the turn ends, the writer reads the code and writes a card. You read the cards and decide: fixed, wontfix, or an issue. What a review leaves becomes a card directly.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; }
    .code { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; }
    .head { font-weight: 600; font-size: 13px; }
    .head.code { font-size: 12.5px; }
    .w rect, .w polygon { fill: #17806a; stroke: #0f5446; }
    .w text { fill: #ffffff; }
    .w .sub { fill: #d9f1ea; }
    .o rect, .o polygon { fill: #eef0f8; stroke: #8790b4; }
    .o text { fill: #161b2e; }
    .o .sub { fill: #454d6b; }
    .y rect, .y polygon { fill: #efeafd; stroke: #6247c2; }
    .y text { fill: #23194f; }
    .y .sub { fill: #4a3d86; }
    rect, polygon { stroke-width: 1.5; }
    .wire { fill: none; stroke: #6b7394; stroke-width: 1.5; }
    .wire.dotted { stroke-dasharray: 2 5; stroke-linecap: round; }
    .tip { fill: #6b7394; }
    .lbl { fill: #6b7394; font-size: 12px; }
    .frame { fill: none; stroke: #8790b4; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .frame-title { fill: #6b7394; font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; }
    .step { fill: #6b7394; font-size: 22px; font-weight: 700; }
    .axis { stroke: #8790b4; stroke-width: 1; }
    .grid { stroke: #8790b4; stroke-width: 1; stroke-dasharray: 2 5; opacity: 0.55; }
    .mark { fill: #17806a; stroke: #0f5446; stroke-width: 1.5; }
    .value { fill: #17806a; font-weight: 600; }
    .name { fill: #3d4563; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .o rect, .o polygon { fill: #1f2439; stroke: #6a73a0; }
      .o text { fill: #e7eaf6; }
      .o .sub { fill: #b4bcd6; }
      .y rect, .y polygon { fill: #271f47; stroke: #a78ff2; }
      .y text { fill: #efeafd; }
      .y .sub { fill: #c9bdf5; }
      .wire { stroke: #8d95b4; }
      .tip { fill: #8d95b4; }
      .lbl, .frame-title, .step { fill: #a3abc8; }
      .frame, .axis, .grid { stroke: #6a73a0; }
      .mark { fill: #45c2a6; stroke: #2a8f79; }
      .value { fill: #45c2a6; }
      .name { fill: #cfd5ea; }
    }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0.8 L 10 5 L 0 9.2 z" class="tip"/>
    </marker>
    <marker id="tip-back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 0.8 L 0 5 L 10 9.2 z" class="tip"/>
    </marker>
  </defs>

  <!-- From left to right: the flag, its card, the decision -->
  <g class="o">
    <rect x="5" y="30" width="150" height="96" rx="7"/>
    <text x="80" y="58" class="head" text-anchor="middle">An agent flags</text>
    <text x="80" y="74" class="sub" text-anchor="middle">what it comes across</text>
    <text x="80" y="90" class="sub" text-anchor="middle">and its task does</text>
    <text x="80" y="106" class="sub" text-anchor="middle">not settle</text>
  </g>
  <g class="w">
    <rect x="185" y="30" width="150" height="96" rx="7"/>
    <text x="260" y="58" class="head" text-anchor="middle">The hook records</text>
    <text x="260" y="74" class="sub" text-anchor="middle">the flag, and answers</text>
    <text x="260" y="90" class="sub" text-anchor="middle">in place of the</text>
    <text x="260" y="106" class="sub" text-anchor="middle">command: Flag 12</text>
  </g>
  <g class="w">
    <rect x="365" y="30" width="150" height="96" rx="7"/>
    <text x="440" y="58" class="head" text-anchor="middle">The writer</text>
    <text x="440" y="74" class="sub" text-anchor="middle">once the turn ends,</text>
    <text x="440" y="90" class="sub" text-anchor="middle">reads the code and</text>
    <text x="440" y="106" class="sub" text-anchor="middle">writes the card</text>
  </g>
  <g class="w">
    <rect x="545" y="30" width="150" height="96" rx="7"/>
    <text x="620" y="58" class="head" text-anchor="middle">Card 12</text>
    <text x="620" y="74" class="sub" text-anchor="middle">a title, labels,</text>
    <text x="620" y="90" class="sub" text-anchor="middle">four sections,</text>
    <text x="620" y="106" class="sub" text-anchor="middle">where it comes from</text>
  </g>
  <g class="y">
    <rect x="725" y="30" width="150" height="96" rx="7"/>
    <text x="800" y="58" class="head" text-anchor="middle">You decide</text>
    <text x="800" y="74" class="sub code" text-anchor="middle">weaver cards</text>
    <text x="800" y="90" class="sub code" text-anchor="middle">weaver close 12 …</text>
    <text x="800" y="106" class="sub" text-anchor="middle">fixed, wontfix, issue</text>
  </g>
  <path d="M 155 78 L 185 78" class="wire" marker-end="url(#tip)"/>
  <path d="M 335 78 L 365 78" class="wire" marker-end="url(#tip)"/>
  <path d="M 515 78 L 545 78" class="wire" marker-end="url(#tip)"/>
  <path d="M 695 78 L 725 78" class="wire" marker-end="url(#tip)"/>

  <!-- A review feeds the same registry, without the writer -->
  <g class="w">
    <rect x="365" y="184" width="150" height="64" rx="7"/>
    <text x="440" y="204" class="head" text-anchor="middle">A review</text>
    <text x="440" y="220" class="sub" text-anchor="middle">leaves a finding</text>
    <text x="440" y="236" class="sub" text-anchor="middle">or a suspicion</text>
  </g>
  <path d="M 515 216 L 612 216 Q 620 216 620 208 L 620 126" class="wire" marker-end="url(#tip)"/>
  <text x="628" y="168" class="lbl" text-anchor="start">a card, directly</text>
  <text x="640" y="240" class="lbl" text-anchor="start">Found again later, the same card</text>
  <text x="640" y="258" class="lbl" text-anchor="start">gains an occurrence, not a twin.</text>
  <g class="w"><rect x="5" y="274" width="12" height="12" rx="3"/></g>
  <text x="23" y="284" class="lbl" text-anchor="start">Weaver</text>
  <g class="o"><rect x="84.6" y="274" width="12" height="12" rx="3"/></g>
  <text x="102.6" y="284" class="lbl" text-anchor="start">the agent and the project</text>
  <g class="y"><rect x="289.6" y="274" width="12" height="12" rx="3"/></g>
  <text x="307.6" y="284" class="lbl" text-anchor="start">you</text>
</svg>
